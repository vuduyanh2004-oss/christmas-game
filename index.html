<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Christmas Quests — Bon &amp; Cún Bizzare Adventure</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b29;font-family:Arial,sans-serif}body{display:grid;place-items:center}#game{position:relative;width:min(100vw,217.557vh);width:min(100vw,217.557dvh);aspect-ratio:852/393;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none;background:#ead0b5}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.full,.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.artbutton,.hotspot{position:absolute;border:0;padding:0;background:none;cursor:pointer;touch-action:none}.artbutton img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.artbutton:focus-visible,.hotspot:focus-visible{outline:2px solid #fff;outline-offset:2px}.back{left:14.8%;top:5.2%;width:3%;height:5.5%}.music{left:82.3%;top:4.6%;width:3%;height:8%}.level{position:absolute;left:43.5%;top:4.6%;width:13%;height:auto;pointer-events:none}.bottom{position:absolute;left:29.2%;top:80.6%;width:41.5%;height:14%;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.bottom .artbutton{position:relative;width:14.2%;height:auto;aspect-ratio:1;pointer-events:auto}.inventory{position:relative;width:64%;aspect-ratio:4;pointer-events:auto}.inventory>img{width:100%;display:block;pointer-events:none}.slot{position:absolute;left:3.4%;top:12%;width:13.8%;height:57%;border:0;background:transparent;padding:0;cursor:pointer;touch-action:none}.slot img{width:100%;height:100%;object-fit:contain;pointer-events:none}.slot.selected{outline:2px solid #ba812b;border-radius:15%}.slot[hidden]{display:none}.dialogue{position:absolute;left:29%;right:29%;bottom:21%;background:#fff8e9f5;border:1.5px solid #39342b;border-radius:8px;padding:1.1% 1.5%;font-size:1.65cqw;line-height:1.3;text-align:center;box-shadow:0 2px 4px #0002;cursor:pointer;z-index:4}.dialogue[hidden]{display:none}.speaker{font-weight:bold;color:#805131;margin-right:.5em}.hotspot{z-index:1}.bottom,.back,.music,.level{z-index:3}#ladder{left:11%;top:25%;width:13%;height:43%}#tree{left:25%;top:18%;width:23%;height:62%}#shelf{left:69%;top:34%;width:20%;height:15%}#plush{left:70%;top:49%;width:8%;height:14%}#sofa{left:47%;top:49%;width:19%;height:25%}#game.holding #ladder{left:15%;top:43%;width:15%;height:38%}#hint{position:absolute;left:35%;right:35%;top:15%;padding:1%;background:#fff8e9;border:1px solid #39342b;border-radius:8px;font-size:1.65cqw;text-align:center;z-index:5}#hint[hidden]{display:none}#ghost{position:absolute;width:3.8%;pointer-events:none;z-index:9;transform:translate(-50%,-50%)}#ghost[hidden]{display:none}#complete{position:absolute;inset:0;background:#17213a88;display:grid;place-items:center;z-index:10}#complete[hidden]{display:none}.card{background:#fff8e9;border:2px solid #39342b;border-radius:12px;padding:3%;text-align:center;font-size:2cqw}.card h2{margin:0 0 .5em}.card button{font:inherit;background:#263c78;color:white;border:0;border-radius:6px;padding:.6em 1.5em;cursor:pointer}.screenStart{position:absolute;inset:0;background:transparent;border:0;cursor:pointer;width:100%;height:100%}.rotate{display:none}@media(orientation:portrait){#game{width:100vw}.rotate{display:block;position:fixed;bottom:12%;color:white;text-align:center;font-size:14px;pointer-events:none}}
</style></head><body><main id="game"><section id="title" class="screen active"><img class="full" data-art="title.png" alt="Christmas Quests"><button class="screenStart" id="start" aria-label="Start the game"></button></section><section id="intro" class="screen"><img class="full" data-art="level1_intro.png" alt="Level 1 Christmas Tree"><button class="screenStart" id="begin" aria-label="Begin level 1"></button></section><section id="play" class="screen"><img class="scene" id="scene" data-art="scene_default.png" alt="Christmas living room"><button class="hotspot" id="ladder" aria-label="Ladder"></button><button class="hotspot" id="tree" aria-label="Christmas tree"></button><button class="hotspot" id="shelf" aria-label="Star on shelf"></button><button class="hotspot" id="plush" aria-label="Plush"></button><button class="hotspot" id="sofa" aria-label="Sofa"></button><button class="artbutton back" id="back" aria-label="Back"><img data-art="ui_back.png" alt=""></button><img class="level" data-art="ui_level_tag.png" alt="Level 01 / 06"><button class="artbutton music" id="music" aria-label="Toggle music" aria-pressed="false"><img data-art="ui_music.png" alt=""></button><div class="bottom"><button class="artbutton" id="swap" aria-label="Switch character, currently Bon"><img data-art="ui_swap.png" alt=""></button><div class="inventory" aria-label="Inventory"><img data-art="ui_inventory.png" alt="Six inventory slots"><button class="slot" id="slot" hidden aria-label="Collected star"><img data-art="star.png" alt="Star"></button></div><button class="artbutton" id="help" aria-label="Hint"><img data-art="ui_hints.png" alt=""></button></div><div class="dialogue" id="dialogue" hidden role="status"><span class="speaker" id="speaker"></span><span id="line"></span></div><div id="hint" hidden></div><img id="ghost" data-art="star.png" hidden alt=""><div id="complete" hidden><div class="card"><h2>One problem down!</h2><p>Five more to go.</p><button id="finish">Continue</button></div></div></section></main><div class="rotate">Rotate your phone for the best experience.</div><script>
const $=id=>document.getElementById(id);const paths=new Map();function art(img,name){img.dataset.art=name;img.onerror=()=>{if(!img.dataset.fallback){img.dataset.fallback='1';img.src=name}};delete img.dataset.fallback;img.src=paths.get(name)||'assets/'+name;}document.querySelectorAll('[data-art]').forEach(img=>art(img,img.dataset.art));let stage=0,who='BON',selected=false,timer, hintTimer, finishTimer, music=false;const game=$('game');function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}function say(msg,speaker=who){clearTimeout(timer);$('speaker').textContent=speaker;$('line').textContent=msg;$('dialogue').hidden=false;timer=setTimeout(()=>$('dialogue').hidden=true,2600)}function render(){game.classList.toggle('holding',stage===1||stage===2);art($('scene'),['scene_default.png','scene_bon_ladder.png','scene_bon_ladder.png','scene_complete.png','scene_laugh.png'][stage]);$('slot').hidden=stage!==2;$('slot').classList.toggle('selected',selected);$('swap').setAttribute('aria-label','Switch character, currently '+who)}function reset(){clearTimeout(timer);clearTimeout(hintTimer);clearTimeout(finishTimer);stage=0;who='BON';selected=false;$('dialogue').hidden=true;$('hint').hidden=true;$('complete').hidden=true;$('ghost').hidden=true;render()}$('start').onclick=()=>show('intro');$('begin').onclick=()=>{reset();show('play')};$('back').onclick=()=>{reset();show('intro')};$('swap').onclick=()=>{if(stage>=3)return;who=who==='BON'?'CÚN':'BON';render();say(who==='CÚN'?'My turn!':'My turn!')};$('ladder').onclick=()=>{if(stage===0){if(who!=='BON'){say('Bon, can you hold the ladder?');return}stage=1;render();say('I’ll hold it steady. Your turn, Cún.')}else if(stage===1)say('The star is on the shelf.');};$('shelf').onclick=()=>{if(stage===0){say('That star is a little too high.');return}if(stage===1){if(who!=='CÚN'){say('I’m holding the ladder! Switch to Cún.');return}stage=2;render();say('Got the star!','CÚN')}else if(stage===2)say('The star is in our inventory.')};function place(){if(stage!==2)return;stage=3;selected=false;render();say('There it is!','CÚN');finishTimer=setTimeout(()=>$('complete').hidden=false,700)}$('tree').onclick=()=>{if(stage===2&&selected)place();else if(stage===2)say('Select the star in our inventory, then tap the tree.');else if(stage===1&&who==='CÚN')say('The star is still on the shelf.');else if(stage<3)say('Something is missing...');};$('plush').onclick=()=>say('We’re not discussing the cockroach.');$('sofa').onclick=()=>say(who==='BON'?'A quick nap?':'Bon. We have a tree to decorate.');$('help').onclick=()=>{clearTimeout(hintTimer);$('hint').textContent=['Choose Bon and tap the ladder.','Switch to Cún and tap the star on the shelf.','Drag the star onto the tree, or tap the star and then the tree.','The tree is complete!','The tree is complete!'][stage];$('hint').hidden=false;hintTimer=setTimeout(()=>$('hint').hidden=true,3500)};$('dialogue').onclick=()=>$('dialogue').hidden=true;$('finish').onclick=()=>{stage=4;render();$('complete').hidden=true;say('That was part of the plan. Obviously.','BON')};$('music').onclick=()=>{music=!music;$('music').setAttribute('aria-pressed',String(music));$('music').style.opacity=music?'1':'.5';say(music?'Music enabled — soundtrack not added yet.':'Music off.')};$('music').style.opacity='.5';let drag=null;function moveGhost(e){const r=game.getBoundingClientRect();$('ghost').style.left=(e.clientX-r.left)+'px';$('ghost').style.top=(e.clientY-r.top)+'px'}$('slot').onpointerdown=e=>{if(stage!==2)return;drag={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};$('slot').setPointerCapture(e.pointerId)};$('slot').onpointermove=e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(drag.moved){$('ghost').hidden=false;moveGhost(e)}};$('slot').onpointerup=e=>{if(!drag)return;const r=$('tree').getBoundingClientRect();if(drag.moved&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)place();else{selected=true;render()}drag=null;$('ghost').hidden=true};$('slot').onpointercancel=()=>{drag=null;$('ghost').hidden=true};$('slot').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=true;render()}};
</script></body></html>
